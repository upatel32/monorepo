<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
	<title>&gt;_</title>
	<!-- Basalt tile with a crust border -->
	<rect width="16" height="16" rx="3" fill="#100d0b" />
	<rect x="0.5" y="0.5" width="15" height="15" rx="2.5" fill="none" stroke="#763719" />
	<!-- Incandescent prompt chevron, drawn on the pixel grid -->
	<g fill="#fff1cf">
		<rect x="3" y="4" width="2" height="1" />
		<rect x="4" y="5" width="2" height="1" />
		<rect x="5" y="6" width="2" height="1" />
		<rect x="6" y="7" width="2" height="2" />
		<rect x="5" y="9" width="2" height="1" />
		<rect x="4" y="10" width="2" height="1" />
		<rect x="3" y="11" width="2" height="1" />
	</g>
	<!-- Lava cursor -->
	<rect x="9" y="10" width="4" height="2" fill="#ff6a24" />
</svg>
